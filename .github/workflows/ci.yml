name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the requires-python range in pyproject.toml, so the
        # declared bound stays honest rather than assumed.
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The default PyPI wheel for Linux is the CUDA build — hundreds of
      # megabytes of GPU runtime this project never uses. Spec §14: no GPU
      # is needed. Install the CPU wheel first; the editable install below
      # then sees the pinned version already satisfied.
      - name: Install CPU-only torch
        run: pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install project and dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -v
