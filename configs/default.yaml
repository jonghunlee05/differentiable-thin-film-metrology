# Default run configuration. Spec §15: reproducibility is a requirement, so every
# run is driven from a file like this one and nothing is left implicit.

# Instrument model, DTFM-034. These numbers were judgement calls until they were
# checked against a real tool; they are now anchored to the J.A. Woollam M-2000
# spectroscopic ellipsometer, the standard instrument for this measurement.
#   range      371-1689 nm (193-1000 nm on the M-2000D variant)
#   resolution ~3 nm in the UV-VIS, ~6 nm in the NIR
#   sampling   "hundreds" of wavelengths, CCD-collected in one shot
#   claimed    thickness repeatability better than 0.1 nm; n,k better than 0.001
# https://www.jawoollam.com/products/m-2000-ellipsometer
# https://www.vanderbilt.edu/vinse/instrumentation/spectroscopic-ellipsometer/
#
# 400-800 nm is a deliberate subset of the real range: the visible band alone,
# where the vendored Si data is valid (206-827 nm) and where §5.2's degeneracies
# are sharpest. 200 points sits at the low end of "hundreds", which DTFM-034
# found matters - the bound oscillates on a scale set by the grid step.
spectrum:
  low_nm: 400.0
  high_nm: 800.0
  points: 200          # §7.2 sizes the network input at ~200 values

measurement:
  # DTFM-028: ellipsometry adopted on measured evidence - 5 to 23x better
  # thickness precision, largest gains in the thin regime. It carries no
  # information at normal incidence, so the angle moved with the decision.
  observable: ellipsometry
  angle_deg: 70.0
  ellipsometer_sigma_rad: 0.001   # 0.057 deg; at 0.57 deg it loses to reflectance

prior:
  # §7.1 calls this a decision, not a detail. See src.generate.Prior for the
  # reasoning; the short version is that DTFM-068 measured the thin-film
  # departure as quadratic in thickness, so uniform sampling would leave almost
  # no examples in the regime §8 and §10 exist to characterise.
  spacing: log-uniform
  thickness_nm: [20.0, 2000.0]
  cauchy_a: [1.40, 1.55]
  cauchy_b: [0.002, 0.012]
  roughness_nm: [0.0, 4.0]
  substrate: Si

corruption:
  # Four of §4.5's seven effects, the ones that are facts of life rather than
  # faults. The remaining three are switched on deliberately by §10's atlas.
  roughness_nm: 0.0    # sampled per film by the prior instead
  bandwidth_fwhm_nm: 3.0
  shot_scale: 0.003
  read_sigma: 0.0005

batch:
  count: 64
  seed: 0
